name: ai-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U pip setuptools wheel
      - run: pip install -r requirements.txt -e . pytest
      - run: pytest -q

  demo-run:
    needs: lint-and-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U pip setuptools wheel
      - run: pip install -r requirements.txt -e .
      - run: ai-deploy run --target aws --env staging --output .deploy/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: .deploy/**

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U pip setuptools wheel
      - run: pip install -r requirements.txt -e . mypy
      - run: mypy ai_deploy

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U pip setuptools wheel
      - run: pip install -r requirements.txt -e . pytest pytest-cov
      - run: pytest -q --cov=ai_deploy --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
