[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-deploy"
version = "0.1.0"
description = "AI-driven infrastructure compiler and deployer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "bmtyger" }]
dependencies = []

[project.scripts]
ai-deploy = "ai_deploy.cli:main"

[tool.setuptools.packages.find]
include = ["ai_deploy*"]
